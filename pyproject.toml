[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxscalp"
version = "0.0.0"
description = "AI Forex/CFD scalping research & execution platform (Phase 0.5 skeleton)"
license = {text = "Proprietary - all rights reserved"}
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "tzdata"]

[project.optional-dependencies]
# Proposed; see docs/IMPLEMENTATION_PLAN.md "Dependencies". Not installed in Phase 0.
data = ["polars"]
ml = ["scikit-learn", "lightgbm", "xgboost", "catboost", "optuna", "shap"]
research = ["scikit-learn>=1.5", "lightgbm>=4.3", "scipy>=1.11"]   # Phase 2B model research (logistic regression + gradient boosting)
mt5 = ["MetaTrader5; platform_system=='Windows'"]
api = ["fastapi", "uvicorn", "sqlalchemy", "psycopg[binary]"]
dev = ["pytest", "pytest-asyncio", "hypothesis", "ruff", "mypy", "psutil"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: slower tests (weekend-length synthetic runs)"]
testpaths = ["tests"]
pythonpath = ["src", "."]
