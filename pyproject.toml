[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxscalp"
version = "0.0.0"
description = "AI Forex/CFD scalping research & execution platform (Phase 0.5 skeleton)"
license = {text = "Proprietary - all rights reserved"}
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# Proposed; see docs/IMPLEMENTATION_PLAN.md "Dependencies". Not installed in Phase 0.
data = ["numpy", "pandas", "polars", "pyarrow"]
ml = ["scikit-learn", "lightgbm", "xgboost", "catboost", "optuna", "shap"]
mt5 = ["MetaTrader5; platform_system=='Windows'"]
api = ["fastapi", "uvicorn", "sqlalchemy", "psycopg[binary]"]
dev = ["pytest", "pytest-asyncio", "hypothesis", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
